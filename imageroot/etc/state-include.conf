#
# ERPNext state/backup include patterns for Restic
# Syntax reference: https://pkg.go.dev/path/filepath#Glob
# Restic --files-from: https://restic.readthedocs.io/en/stable/040_backup.html#including-files
#
# state/dumps holds one database dump per site (bin/module-dump-state),
# state/sites.json the route options of the added sites.
# The sites volume holds site_config.json and the public and private files
# of every site. state/environment is always saved by the core.
#

state/smarthost.env
state/database.env
state/configurator.env
state/erpnext-modules.env
state/dumps
state/sites.json
state/git-token
volumes/sites
volumes/logs
